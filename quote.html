<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Request a Quote</title>

    <link rel="stylesheet" href="css/style.css">

</head>

 

<body>

 

<header>

 

    <h1>Request a Quote</h1>

    <img src="images/logo.png" style="=width:200px; height:350px;">

    <nav>

 

        <a href="index.html">Home</a><br>

        <a href="about.html">About</a><br>

        <a href="services.html">Services</a><br>

        <a href="contact.html">Contact</a><br>

        <a href="gallery.html">Gallery</a>

    </nav>

 

    <hr>

</header>

 

<form>

 

    <label for="fullname">Full Name</label><br>

    <input type="text" id="fullname" name="fullname" required>

    <br><br>

 

    <label for="email">Email Address</label><br>

    <input type="email" id="email" name="email" required>

    <br><br>

 

    <label for="phone">Phone Number</label><br>

    <input type="tel" id="phone" name="phone" required>

    <br><br>

 

    <label for="service">Select Service</label><br>

    <select id="service" name="service" required>

 

        <option value="">-- Select a Service --</option>

 

        <option value="Electrical Installations">

            Electrical Installations

        </option>

 

        <option value="Fault Finding and Repairs">

            Fault Finding and Repairs

        </option>

 

        <option value="Lighting Installation">

            Lighting Installation

        </option>

 

        <option value="Electrical Maintenance">

            Electrical Maintenance

        </option>

 

        <option value="Emergency Electrical Services">

            Emergency Electrical Services

        </option>

 

    </select>

 

    <br><br>

 

    <label for="details">Project Details</label><br>

 

    <textarea

            id="details"

            name="details"

            rows="6"

            cols="50"

            placeholder="Please describe the work you require..."

            required>

    </textarea>

 

    <br><br>

 

    <button type="submit">

        Submit Quote Request

    </button>


</form>


<footer>

    <hr>

    <p>

        Bright Spark Electrical Services |

        Professional Electrical Solutions

    </p>

</footer>

</body>

</html>
