<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Request a Quote</title>

    <link rel="preconnect" href=https://fonts.googleapis.com>

    <link rel="preconnect" href=https://fonts.gstatic.com crossorigin>

    <link href=https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

</head>

<body class="site-page">

<header class="site-header">

    <div class="brand-wrap">

        <img class="brand-logo" src="images/logo.png" alt="Bright Spark Electrical Services logo">

        <div class="brand-text">

            <span class="brand-kicker">Bright Spark</span>

            <h2>Electrical Services</h2>

        </div>

    </div>



    <nav class="main-nav" aria-label="Main navigation">

        <a href="index.html">Home</a>

        <a href="about.html">About</a>

        <a href="services.html">Services</a>

        <a href="quote.html">Request Quote</a>

        <a href="contact.html">Contact</a>

        <a href="gallery.html">Gallery</a>

    </nav>

</header>



<main class="page-shell">

    <section class="content-panel">

        <p class="eyebrow">Request a quote</p>

        <h1>Tell us about your electrical project.</h1>



        <form>

            <div class="form-grid">

                <div>

                    <label for="fullname">Full Name</label>

                    <input type="text" id="fullname" name="fullname" required>

                </div>



                <div>

                    <label for="email">Email Address</label>

                    <input type="email" id="email" name="email" required>

                </div>



                <div>

                    <label for="phone">Phone Number</label>

                    <input type="tel" id="phone" name="phone" required>

                </div>



                <div>

                    <label for="service">Select Service</label>

                    <select id="service" name="service" required>

                        <option value="">-- Select a Service --</option>

                        <option value="Electrical Installations">Electrical Installations</option>

                        <option value="Fault Finding and Repairs">Fault Finding and Repairs</option>

                        <option value="Lighting Installation">Lighting Installation</option>

                        <option value="Electrical Maintenance">Electrical Maintenance</option>

                        <option value="Emergency Electrical Services">Emergency Electrical Services</option>

                    </select>

                </div>

            </div>



            <div>

                <label for="details">Project Details</label>

                <textarea id="details" name="details" placeholder="Please describe the work you require..." required></textarea>

            </div>



            <button type="submit">Submit Quote Request</button>

        </form>

    </section>

</main>

</body>

</html>
